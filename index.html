<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busca CEP — Paraíba</title>
<link rel="icon" href="localização.ico" type="image/x-icon">
<link rel="shortcut icon" href="localização.ico">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #238636;
    --accent2: #2ea043;
    --gold: #e3b341;
    --text: #e6edf3;
    --muted: #8b949e;
    --danger: #f85149;
    --blue: #388bfd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo-badge {
    background: var(--gold);
    color: #000;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 1.5px;
    padding: 4px 10px;
    border-radius: 4px;
  }
  header h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text);
  }
  header span.sub {
    font-size: 13px;
    color: var(--muted);
    margin-left: auto;
  }

  main {
    flex: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 20px;
    width: 100%;
  }

  /* SEARCH BOX */
  .search-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 28px;
  }
  .search-card h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .search-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .field-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field-group label {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .field-group select,
  .field-group input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    padding: 9px 12px;
    border-radius: 6px;
    outline: none;
    transition: border-color .2s;
  }
  .field-group select:focus,
  .field-group input:focus {
    border-color: var(--blue);
  }
  .field-group select { min-width: 200px; cursor: pointer; }
  .field-group input { min-width: 240px; }
  .field-group.grow { flex: 1; }
  .field-group.grow input { width: 100%; }

  .btn {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
    padding: 10px 22px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s, transform .1s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--accent2); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: default; }

  .btn-secondary {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-secondary:hover { background: var(--border); }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 10px 18px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s;
    margin-bottom: -1px;
  }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--blue);
  }

  /* STATUS BAR */
  #status {
    font-size: 13px;
    color: var(--muted);
    padding: 8px 0 16px;
    min-height: 36px;
  }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--accent2); }

  /* RESULTS TABLE */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  thead tr {
    background: var(--surface2);
  }
  th {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 11px 14px;
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  .cep-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cep-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--gold);
  }
  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
    padding: 2px 7px;
    transition: all .15s;
    font-family: 'Barlow', sans-serif;
    white-space: nowrap;
  }
  .copy-btn:hover { border-color: var(--blue); color: var(--blue); }
  .copy-btn.copied { border-color: var(--accent2); color: var(--accent2); }

  /* CEP DIRETO */
  #resultado-direto {
    margin-top: 10px;
  }
  .result-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    display: none;
  }
  .result-block.show { display: block; }
  .result-block .cep-big {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 34px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: 3px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .result-block .copy-btn-big {
    font-size: 13px;
    padding: 5px 14px;
  }
  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 24px;
    margin-top: 12px;
  }
  .result-item label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 2px;
  }
  .result-item span {
    font-size: 14px;
    color: var(--text);
  }

  /* LOADING */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .empty-state .icon { font-size: 36px; margin-bottom: 10px; }

  footer {
    text-align: center;
    padding: 16px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }

  @media (max-width: 560px) {
    .search-row { flex-direction: column; }
    .field-group select, .field-group input { min-width: 0; width: 100%; }
    .btn { width: 100%; justify-content: center; }
    .result-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-badge">PB</div>
  <h1>BUSCA CEP — PARAÍBA</h1>
  <span class="sub">ViaCEP API</span>
</header>

<main>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('logradouro')">Buscar por Logradouro</div>
    <div class="tab" onclick="switchTab('cep')">Consultar CEP</div>
  </div>

  <!-- TAB: LOGRADOURO -->
  <div id="tab-logradouro">
    <div class="search-card">
      <h2>Buscar endereços na Paraíba</h2>
      <div class="search-row">
        <div class="field-group">
          <label>Município</label>
          <select id="municipio">
            <option value="">— selecione —</option>
          </select>
        </div>
        <div class="field-group grow">
          <label>Logradouro (rua, av, travessa…)</label>
          <input type="text" id="logradouro" placeholder="Ex: Rua das Flores" onclick="this.select()" />
        </div>
        <button class="btn" id="btn-buscar" onclick="buscarLogradouro()">Buscar</button>
      </div>
    </div>

    <div id="status"></div>
    <div id="resultados"></div>
  </div>

  <!-- TAB: CEP DIRETO -->
  <div id="tab-cep" style="display:none">
    <div class="search-card">
      <h2>Consultar CEP diretamente</h2>
      <div class="search-row">
        <div class="field-group grow">
          <label>CEP</label>
          <input type="text" id="input-cep" placeholder="58000-000" maxlength="9" oninput="mascaraCep(this)" onkeydown="if(event.key==='Enter')consultarCep()" />
        </div>
        <button class="btn" onclick="consultarCep()">Consultar</button>
      </div>
    </div>
    <div id="status-cep"></div>
    <div id="resultado-direto">
      <div class="result-block" id="block-direto"></div>
    </div>
  </div>

</main>

<footer>Dados: <strong>ViaCEP</strong> — Gratuito e público &nbsp;|&nbsp; Estado: <strong>PB</strong></footer>

<script>
// Municípios da Paraíba (lista completa)
const municipiosPB = [
  "Água Branca","Aguiar","Alagoa Grande","Alagoa Nova","Alagoinha","Alcantil","Algodão de Jandaíra",
  "Alhandra","Amparo","Aparecida","Araçagi","Arara","Araruna","Areia","Areia de Baraúnas","Areial",
  "Aroeiras","Assunção","Baía da Traição","Bananeiras","Baraúna","Barra de Santa Rosa","Barra de Santana",
  "Barra de São Miguel","Bayeux","Belém","Belém do Brejo do Cruz","Bernardino Batista","Boa Ventura",
  "Boa Vista","Bom Jesus","Bom Sucesso","Bonito de Santa Fé","Boqueirão","Borborema","Brejo do Cruz",
  "Brejo dos Santos","Caaporã","Cabaceiras","Cabedelo","Cachoeira dos Índios","Cacimba de Areia",
  "Cacimba de Dentro","Cacimbas","Caiçara","Cajazeiras","Cajazeirinhas","Caldas Brandão","Camalaú",
  "Campina Grande","Campo de Santana","Capim","Caraúbas","Carrapateira","Casserengue","Catingueira",
  "Catolé do Rocha","Caturité","Conceição","Condado","Conde","Congo","Coremas","Coxixola",
  "Cruz do Espírito Santo","Cubati","Cuité","Cuité de Mamanguape","Cuitiegi","Curral de Cima",
  "Curral Velho","Damião","Desterro","Diamante","Dona Inês","Duas Estradas","Emas","Esperança",
  "Fagundes","Frei Martinho","Gado Bravo","Guarabira","Gurinhém","Gurjão","Ibiara","Igaracy",
  "Imaculada","Ingá","Itabaiana","Itaporanga","Itapororoca","Itatuba","Jacaraú","Jericó",
  "João Pessoa","Joca Claudino","Juarez Távora","Juazeirinho","Junco do Seridó","Juripiranga",
  "Juru","Lagoa","Lagoa de Dentro","Lagoa Seca","Lastro","Livramento","Logradouro","Lucena",
  "Mãe d'Água","Malta","Mamanguape","Manaíra","Marcação","Mari","Marizópolis","Massaranduba",
  "Mataraca","Matinhas","Mato Grosso","Maturéia","Mogeiro","Montadas","Monte Horebe","Monteiro",
  "Mulungu","Natuba","Nazarezinho","Nova Floresta","Nova Olinda","Nova Palmeira","Olho d'Água",
  "Olivedos","Ouro Velho","Parari","Passagem","Patos","Paulista","Pedra Branca","Pedra Lavrada",
  "Pedras de Fogo","Pedro Régis","Piancó","Picuí","Pilar","Pilões","Pilõezinhos","Pirpirituba",
  "Pitimbu","Pocinhos","Poço Dantas","Poço de José de Moura","Pombal","Prata","Princesa Isabel",
  "Puxinanã","Queimadas","Quixabá","Remígio","Riachão","Riachão do Bacamarte","Riachão do Poço",
  "Riacho de Santo Antônio","Riacho dos Cavalos","Rio Tinto","Salgadinho","Salgado de São Félix",
  "Santa Cecília","Santa Cruz","Santa Helena","Santa Inês","Santa Luzia","Santa Rita","Santa Teresinha",
  "Santana de Mangueira","Santana dos Garrotes","Santo André","São Bentinho","São Bento",
  "São Domingos","São Domingos do Cariri","São Francisco","São João do Cariri","São João do Rio do Peixe",
  "São João do Tigre","São José da Lagoa Tapada","São José de Caiana","São José de Espinharas",
  "São José de Piranhas","São José de Princesa","São José do Bonfim","São José do Brejo do Cruz",
  "São José do Sabugi","São José dos Cordeiros","São José dos Ramos","São Mamede","São Miguel de Taipu",
  "São Sebastião de Lagoa de Roça","São Sebastião do Umbuzeiro","São Vicente do Seridó","Sapé",
  "Serra Branca","Serra da Raiz","Serra Grande","Serra Redonda","Serraria","Sertãozinho","Sobrado",
  "Solânea","Soledade","Sossego","Sousa","Sumé","Taperoá","Tavares","Teixeira","Tenório","Triunfo",
  "Uiraúna","Umbuzeiro","Várzea","Vieirópolis","Vista Serrana","Zabelê"
];

// Popula select
const sel = document.getElementById('municipio');
municipiosPB.sort().forEach(m => {
  const o = document.createElement('option');
  o.value = m;
  o.textContent = m;
  sel.appendChild(o);
});

// TAB SWITCH
function switchTab(name) {
  document.getElementById('tab-logradouro').style.display = name === 'logradouro' ? '' : 'none';
  document.getElementById('tab-cep').style.display = name === 'cep' ? '' : 'none';
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (name === 'logradouro' && i===0) || (name === 'cep' && i===1));
  });
}

// BUSCAR POR LOGRADOURO
async function buscarLogradouro() {
  const municipio = document.getElementById('municipio').value.trim();
  const logradouro = document.getElementById('logradouro').value.trim();
  const status = document.getElementById('status');
  const resultados = document.getElementById('resultados');

  if (!municipio) { setStatus(status, 'Selecione um município.', 'error'); return; }
  if (logradouro.length < 3) { setStatus(status, 'Digite ao menos 3 caracteres do logradouro.', 'error'); return; }

  setStatus(status, '<span class="spinner"></span>Buscando…', '');
  resultados.innerHTML = '';
  document.getElementById('btn-buscar').disabled = true;

  try {
    const url = `https://viacep.com.br/ws/PB/${encodeURIComponent(municipio)}/${encodeURIComponent(logradouro)}/json/`;
    const res = await fetch(url);
    const data = await res.json();

    document.getElementById('btn-buscar').disabled = false;

    if (!Array.isArray(data) || data.length === 0) {
      setStatus(status, 'Nenhum resultado encontrado.', 'error');
      resultados.innerHTML = `<div class="empty-state"><div class="icon">🔍</div>Nenhum endereço encontrado para "<b>${logradouro}</b>" em <b>${municipio}</b>.</div>`;
      return;
    }

    setStatus(status, `<b>${data.length}</b> resultado${data.length>1?'s':''} encontrado${data.length>1?'s':''}.`, 'ok');

    let html = `<div class="table-wrap"><table>
      <thead><tr>
        <th>CEP</th><th>Logradouro</th><th>Complemento</th><th>Bairro</th><th>Localidade</th>
      </tr></thead><tbody>`;

    data.forEach(r => {
      html += `<tr>
        <td>
          <div class="cep-cell">
            <span class="cep-val">${r.cep}</span>
            <button class="copy-btn" onclick="copiar(this,'${r.cep}')">📋 Copiar</button>
          </div>
        </td>
        <td>${r.logradouro || '—'}</td>
        <td>${r.complemento || '—'}</td>
        <td>${r.bairro || '—'}</td>
        <td>${r.localidade || '—'}</td>
      </tr>`;
    });

    html += '</tbody></table></div>';
    resultados.innerHTML = html;
  } catch(e) {
    document.getElementById('btn-buscar').disabled = false;
    setStatus(status, 'Erro ao consultar a API. Verifique sua conexão.', 'error');
  }
}

// CONSULTAR CEP DIRETO
async function consultarCep() {
  const raw = document.getElementById('input-cep').value.replace(/\D/g,'');
  const status = document.getElementById('status-cep');
  const block = document.getElementById('block-direto');

  if (raw.length !== 8) { setStatus(status, 'Digite um CEP válido com 8 dígitos.', 'error'); return; }

  setStatus(status, '<span class="spinner"></span>Consultando…', '');
  block.classList.remove('show');

  try {
    const res = await fetch(`https://viacep.com.br/ws/${raw}/json/`);
    const d = await res.json();

    if (d.erro) {
      setStatus(status, 'CEP não encontrado.', 'error');
      return;
    }

    // Verifica se é PB (opcional: não bloqueia, só avisa)
    const aviso = d.uf !== 'PB' ? ` <span style="color:var(--gold)">⚠ CEP fora da PB (${d.uf})</span>` : '';
    setStatus(status, `CEP encontrado.${aviso}`, 'ok');

    const cepFmt = d.cep;
    block.innerHTML = `
      <div class="cep-big">
        ${cepFmt}
        <button class="copy-btn copy-btn-big" onclick="copiar(this,'${cepFmt}')">📋 Copiar CEP</button>
      </div>
      <div class="result-grid">
        <div class="result-item"><label>Logradouro</label><span>${d.logradouro || '—'}</span></div>
        <div class="result-item"><label>Complemento</label><span>${d.complemento || '—'}</span></div>
        <div class="result-item"><label>Bairro</label><span>${d.bairro || '—'}</span></div>
        <div class="result-item"><label>Localidade</label><span>${d.localidade || '—'}</span></div>
        <div class="result-item"><label>UF</label><span>${d.uf || '—'}</span></div>
        <div class="result-item"><label>IBGE</label><span>${d.ibge || '—'}</span></div>
        <div class="result-item"><label>DDD</label><span>${d.ddd || '—'}</span></div>
        <div class="result-item"><label>SIAFI</label><span>${d.siafi || '—'}</span></div>
      </div>`;
    block.classList.add('show');
  } catch(e) {
    setStatus(status, 'Erro ao consultar. Verifique sua conexão.', 'error');
  }
}

// MÁSCARA CEP
function mascaraCep(el) {
  let v = el.value.replace(/\D/g,'');
  if (v.length > 5) v = v.slice(0,5) + '-' + v.slice(5,8);
  el.value = v;
}

// COPIAR
function copiar(btn, cep) {
  navigator.clipboard.writeText(cep).then(() => {
    btn.textContent = '✓ Copiado!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 Copiar' + (btn.classList.contains('copy-btn-big') ? ' CEP' : '');
      btn.classList.remove('copied');
    }, 2000);
  });
}

// STATUS
function setStatus(el, msg, tipo) {
  el.innerHTML = msg;
  el.className = tipo;
}

// Enter no campo logradouro
document.getElementById('logradouro').addEventListener('keydown', e => {
  if (e.key === 'Enter') buscarLogradouro();
});
</script>
</body>
</html>
